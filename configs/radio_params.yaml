# 电磁参数表（ITU-R P.2040 近似值）· 材质体系 v2（6 类；drop roof，ground_road→asphalt）
# 类别顺序须与 configs/classes.txt 及 material_common._DEFAULT_CLASS_ORDER 严格一致。
# 频率暂用单一 3.5 GHz；后续可扩为 2.4/3.5/5.8 三频段。

frequency_mhz: 3500
tx_power_dbm: 23
tx_gain_dbi: 0
rx_gain_dbi: 0
rx_height_m: 1.5
grid_spacing_m: 10

class_order:
  - background
  - vegetation
  - asphalt
  - concrete
  - glass
  - metal

materials:
  background:                       # 不确定/天空 → 视作自由空间（实体面尽量归 concrete）
    eps_r: 1.0
    sigma: 0.0
    penetration_loss_db: 0.0
  vegetation:                       # 植被(树/草) → 叶簇穿透损耗
    eps_r: 1.5
    sigma: 0.05
    penetration_loss_db: 6.0
  asphalt:                          # 地面/道路(沥青/土) → 近不透
    eps_r: 8.0
    sigma: 0.02
    penetration_loss_db: 30.0
  concrete:                         # 混凝土墙/硬化面/屋顶(混凝土屋面归此)
    eps_r: 5.31
    sigma: 0.0326
    penetration_loss_db: 12.0
  glass:                            # 玻璃幕墙/窗
    eps_r: 6.27
    sigma: 0.0043
    penetration_loss_db: 4.0
  metal:                            # 金属屋顶/幕墙/栏杆 → 近全反射
    eps_r: 1.0
    sigma: 1.0e+7
    penetration_loss_db: 40.0
